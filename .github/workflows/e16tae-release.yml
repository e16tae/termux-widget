# e16tae fork: build release APKs signed with my own key and publish a GitHub release.
# - push to the e16tae branch: build
# - weekly schedule / manual run: merge upstream master first, build only if something changed
# Secrets: SIGNING_KEYSTORE_BASE64, SIGNING_KEYSTORE_PASSWORD, SIGNING_KEY_ALIAS, NTFY_TOPIC
name: e16tae release

on:
  push:
    branches: [e16tae]
  schedule:
    - cron: "0 18 * * 0" # every Monday 03:00 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: e16tae-release
  cancel-in-progress: false

env:
  UPSTREAM_REPO: termux/termux-widget
  APP_NAME: Termux:Widget (e16tae)
  GRADLE_TASK: assembleRelease
  # gh would otherwise resolve the "upstream" remote as the base repo.
  GH_REPO: ${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout e16tae
        uses: actions/checkout@v6
        with:
          ref: e16tae
          fetch-depth: 0

      # Merge upstream master in the runner only (no push: GITHUB_TOKEN cannot push
      # upstream's workflow-file changes). The upstream sha is recorded in the release notes.
      - name: Merge upstream master (local only)
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "BRANCH_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream master
          UP_SHA="$(git rev-parse upstream/master)"
          echo "UP_SHA=$UP_SHA" >> "$GITHUB_ENV"
          LAST_UP="$(gh release view --json body -q .body 2>/dev/null | sed -n 's/^upstream-sha: \([0-9a-f]*\).*/\1/p' | head -1 || true)"
          LAST_BR="$(gh release view --json body -q .body 2>/dev/null | sed -n 's/^branch-sha: \([0-9a-f]*\).*/\1/p' | head -1 || true)"
          if [ "$LAST_UP" = "$UP_SHA" ] && [ "$LAST_BR" = "$(git rev-parse HEAD)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          if ! git merge-base --is-ancestor upstream/master HEAD; then
            if ! git merge --no-edit upstream/master; then
              echo "::error::Merge conflict with upstream master. Update the e16tae branch manually."
              exit 1
            fi
          fi

      - name: Decide whether to build
        id: go
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ steps.sync.outputs.changed }}" != "true" ]; then
            echo "Nothing new since the last release."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup java 17
        if: steps.go.outputs.build == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build unsigned release APKs
        if: steps.go.outputs.build == 'true'
        run: |
          set -euo pipefail
          SHA="$(git rev-parse --short=7 HEAD)"
          BASE="$(grep -m1 -E '^\s+versionName "' app/build.gradle | sed -E 's/.*"([^"]+)".*/\1/')"
          VERSION="${BASE}+e16tae.${GITHUB_RUN_NUMBER}.${SHA}"
          TAG="e16tae-${GITHUB_RUN_NUMBER}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          export TERMUX_APP_VERSION_NAME="$VERSION"
          export TERMUX_APK_VERSION_TAG="v${VERSION}-e16tae"
          export TERMUX_PACKAGE_VARIANT="apt-android-7"
          # termux-app: the native build needs the bootstrap zips, and in release builds it can run
          # before javaCompile (which is what downloadBootstraps hangs off), so fetch them first.
          if grep -q 'task downloadBootstraps' app/build.gradle; then
            ./gradlew --no-daemon downloadBootstraps
          fi
          ./gradlew --no-daemon "$GRADLE_TASK"
          ls -la app/build/outputs/apk/release/

      - name: Sign APKs
        if: steps.go.outputs.build == 'true'
        env:
          KS_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          KS="$RUNNER_TEMP/release.jks"
          printf '%s' "$KS_B64" | base64 -d > "$KS"
          mkdir -p dist
          for apk in app/build/outputs/apk/release/*.apk; do
            name="$(basename "$apk" .apk)"
            name="${name%-unsigned}"
            "$BT/zipalign" -f -p 4 "$apk" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" sign --v4-signing-enabled false --ks "$KS" --ks-pass env:KS_PASS --ks-key-alias "$KS_ALIAS" \
              --out "dist/${name}.apk" "$RUNNER_TEMP/aligned.apk"
            "$BT/apksigner" verify --print-certs "dist/${name}.apk" | sed -n 1,3p
          done
          rm -f "$KS"
          (cd dist && sha256sum *.apk > SHA256SUMS)
          ls -la dist

      - name: Publish release
        if: steps.go.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES="$(printf 'e16tae patches merged with upstream %s master. Signed with the e16tae key.\n\nupstream-sha: %s\nbranch-sha: %s\n' "$UPSTREAM_REPO" "$UP_SHA" "$BRANCH_SHA")"
          gh release create "$TAG" dist/* --target "$BRANCH_SHA" \
            --title "${APP_NAME} ${VERSION}" --notes "$NOTES"

      - name: Notify (success)
        if: success() && steps.go.outputs.build == 'true'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          [ -n "${NTFY_TOPIC:-}" ] || exit 0
          curl -fsS -H "Title: ${APP_NAME} new build" -H "Tags: package" \
            -d "${VERSION} released (${TAG})" "https://ntfy.sh/${NTFY_TOPIC}" >/dev/null || true

      - name: Notify (failure)
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          [ -n "${NTFY_TOPIC:-}" ] || exit 0
          curl -fsS -H "Title: ${APP_NAME} build FAILED" -H "Priority: high" -H "Tags: warning" \
            -d "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "https://ntfy.sh/${NTFY_TOPIC}" >/dev/null || true
